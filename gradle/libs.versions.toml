[versions]
assertj-swing-version = "3.17.1"
awt-extensions-version = "2.0"
commons-lang3-version = "3.20.0"
component-model-version = "2"
data-api-version = "5"
file-worker-version = "19.0"
gen-tree-version = "11.1"
gradle-plugin-lombok-version = "9.5.0"
gradle-plugin-spotless-version = "8.10.0"
gradle-plugin-version-catalog-update-version = "1.1.1"
gradle-plugin-versions-version = "0.61.0"
icon-img-extensions-version = "4.1"
id-generate-version = "1.1"
junit-jupiter-version = "6.1.3"
junit-platform-launcher-version = "6.1.3"
lombok-version = "1.18.46"
meanbean-version = "2.0.3"
menu-action-version = "5.1"
miglayout-swing-version = "11.4.3"
model-data-version = "3.2.1"
roboter-version = "2"
silk-icon-theme-version = "1"
silly-collection-version = "28.1"
silly-io-version = "3.6"
swing-base-components-version = "5.1"
swing-model-components-version = "1.1"
swing-renderer-version = "3.1"
swing-table-components-version = "3.1"
tango-icon-theme-version = "0.8.90"
test-object-version = "9"
throwable-version = "3"
tree-api-version = "2.1"
visitor-pattern-version = "7"

[libraries]
assertj-swing = { module = "org.assertj:assertj-swing", version.ref = "assertj-swing-version" }
awt-extensions = { module = "io.github.astrapi69:awt-extensions", version.ref = "awt-extensions-version" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3-version" }
component-model = { module = "io.github.astrapi69:component-model", version.ref = "component-model-version" }
data-api = { module = "io.github.astrapi69:data-api", version.ref = "data-api-version" }
file-worker = { module = "io.github.astrapi69:file-worker", version.ref = "file-worker-version" }
gen-tree = { module = "io.github.astrapi69:gen-tree", version.ref = "gen-tree-version" }
icon-img-extensions = { module = "io.github.astrapi69:icon-img-extensions", version.ref = "icon-img-extensions-version" }
id-generate = { module = "io.github.astrapi69:id-generate", version.ref = "id-generate-version" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter-version" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform-launcher-version" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok-version" }
meanbean = { module = "org.meanbean:meanbean", version.ref = "meanbean-version" }
menu-action = { module = "io.github.astrapi69:menu-action", version.ref = "menu-action-version" }
miglayout-swing = { module = "com.miglayout:miglayout-swing", version.ref = "miglayout-swing-version" }
model-data = { module = "io.github.astrapi69:model-data", version.ref = "model-data-version" }
roboter = { module = "io.github.astrapi69:roboter", version.ref = "roboter-version" }
silk-icon-theme = { module = "io.github.astrapi69:silk-icon-theme", version.ref = "silk-icon-theme-version" }
silly-collection = { module = "io.github.astrapi69:silly-collection", version.ref = "silly-collection-version" }
silly-io = { module = "io.github.astrapi69:silly-io", version.ref = "silly-io-version" }
swing-base-components = { module = "io.github.astrapi69:swing-base-components", version.ref = "swing-base-components-version" }
swing-model-components = { module = "io.github.astrapi69:swing-model-components", version.ref = "swing-model-components-version" }
swing-renderer = { module = "io.github.astrapi69:swing-renderer", version.ref = "swing-renderer-version" }
swing-table-components = { module = "io.github.astrapi69:swing-table-components", version.ref = "swing-table-components-version" }
tango-icon-theme = { module = "org.freedesktop.tango:tango-icon-theme", version.ref = "tango-icon-theme-version" }
test-object = { module = "io.github.astrapi69:test-object", version.ref = "test-object-version" }
throwable = { module = "io.github.astrapi69:throwable", version.ref = "throwable-version" }
tree-api = { module = "io.github.astrapi69:tree-api", version.ref = "tree-api-version" }
visitor-pattern = { module = "io.github.astrapi69:visitor-pattern", version.ref = "visitor-pattern-version" }

[bundles]
# Dependencies for the annotation processor used during the compilation process
annotation-processor = [
    "lombok",
]
# Dependencies required only at compile-time and not included in the final artifact
compile-only = [
    "lombok",
]
# The core dependencies
core-dependencies = [
    "commons-lang3",
    "component-model",
    "data-api",
    "gen-tree",
    "icon-img-extensions",
    "menu-action",
    "miglayout-swing",
    "model-data",
    "roboter",
    "silly-collection",
    "swing-base-components",
    "swing-model-components",
    "swing-renderer",
    "swing-table-components",
    "tree-api",
    "visitor-pattern",
]
# Annotation processor dependencies used specifically for test classes
test-annotation-processor = [
    "lombok",
]
# Dependencies required only at test compile-time and not included in test runtime
test-compile-only = [
    "lombok",
]
# Dependencies required only at test runtime, such as test execution platforms
test-runtime-only = [
    "junit-platform-launcher",
]
# Dependencies required for unit testing
unit-testing = [
    "assertj-swing",
    "awt-extensions",
    "file-worker",
    "id-generate",
    "junit-jupiter",
    "meanbean",
    "silk-icon-theme",
    "silly-io",
    "tango-icon-theme",
    "test-object",
    "throwable",
]

[plugins]
gradle-versions-plugin = { id = "com.github.ben-manes.versions", version.ref = "gradle-plugin-versions-version" }
lombok-plugin = { id = "io.freefair.lombok", version.ref = "gradle-plugin-lombok-version" }
spotless-plugin-gradle = { id = "com.diffplug.spotless", version.ref = "gradle-plugin-spotless-version" }
versionCatalogUpdate = { id = "nl.littlerobots.version-catalog-update", version.ref = "gradle-plugin-version-catalog-update-version" }
